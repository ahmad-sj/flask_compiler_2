{% extends "base.html" %}

{% block title %} {{ product.name }} {% endblock %}

{% block content %}

<h2>{{ product.name }}</h2>

<div
        style="
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    background: white;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  "
>
    <div>
        <img
                src="{{ product.image }}"
                alt="{{ product.name }}"
                style="max-width: 400px; border-radius: 8px;"
        />
    </div>

    <div style="flex: 1; min-width: 300px;">
        <h3 style="margin-top: 0;">
            Price:
            <span style="color: #28a745; font-size: 1.8rem;"
            >${{ "%.2f"|format(product.price) }}</span
            >
        </h3>

        <p> <strong> Details: </strong> <br /> {{ product.details }} </p>

        <a href="{{ url_for('index') }}" class="btn">Back to List</a>
        <a href="{{ url_for('edit', product_id=product.id) }}" class="btn">Edit</a>
        <form action="{{ url_for('delete', product_id=product.id) }}" method="POST" style="display: inline;">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this product?')">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
